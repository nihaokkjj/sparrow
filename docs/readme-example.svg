<svg width="900" height="420" viewBox="0 0 900 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sparrow example renderer output</title>
  <desc id="desc">An SVG composition with a card background, grid lines, a rectangle, a ring, a trend line, points, and a caption rendered in Sparrow style.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#FFF9F1"/>
    </linearGradient>
    <linearGradient id="area" x1="150" y1="280" x2="700" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8EC5FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#13C2C2" stop-opacity="0.24"/>
    </linearGradient>
    <filter id="shadow" x="64" y="28" width="772" height="336" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1F2937" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="900" height="420" rx="24" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="92" y="52" width="716" height="284" rx="22" fill="white"/>
  </g>

  <g opacity="0.65">
    <line x1="150" y1="100" x2="150" y2="288" stroke="#E8EEF7"/>
    <line x1="260" y1="100" x2="260" y2="288" stroke="#E8EEF7"/>
    <line x1="370" y1="100" x2="370" y2="288" stroke="#E8EEF7"/>
    <line x1="480" y1="100" x2="480" y2="288" stroke="#E8EEF7"/>
    <line x1="590" y1="100" x2="590" y2="288" stroke="#E8EEF7"/>
    <line x1="700" y1="100" x2="700" y2="288" stroke="#E8EEF7"/>
    <line x1="150" y1="288" x2="730" y2="288" stroke="#E8EEF7"/>
    <line x1="150" y1="241" x2="730" y2="241" stroke="#E8EEF7"/>
    <line x1="150" y1="194" x2="730" y2="194" stroke="#E8EEF7"/>
    <line x1="150" y1="147" x2="730" y2="147" stroke="#E8EEF7"/>
    <line x1="150" y1="100" x2="730" y2="100" stroke="#E8EEF7"/>
  </g>

  <path d="M150 260 L250 222 L350 236 L450 182 L550 196 L650 146 L730 158 L730 288 L150 288 Z" fill="url(#area)"/>
  <path d="M150 260 L250 222 L350 236 L450 182 L550 196 L650 146 L730 158" stroke="#13C2C2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g>
    <circle cx="150" cy="260" r="7" fill="#13C2C2"/>
    <circle cx="250" cy="222" r="7" fill="#13C2C2"/>
    <circle cx="350" cy="236" r="7" fill="#13C2C2"/>
    <circle cx="450" cy="182" r="7" fill="#13C2C2"/>
    <circle cx="550" cy="196" r="7" fill="#13C2C2"/>
    <circle cx="650" cy="146" r="7" fill="#13C2C2"/>
    <circle cx="730" cy="158" r="7" fill="#13C2C2"/>
  </g>

  <rect x="150" y="122" width="120" height="72" rx="12" fill="#91D5FF" stroke="#1677FF" stroke-width="3"/>
  <circle cx="618" cy="138" r="23" fill="none" stroke="#FAAD14" stroke-width="18"/>
  <circle cx="618" cy="138" r="33" fill="none" stroke="#D48806" stroke-width="2"/>
  <circle cx="618" cy="138" r="13" fill="none" stroke="#D48806" stroke-width="2"/>

  <line x1="182" y1="206" x2="712" y2="242" stroke="#722ED1" stroke-width="3" stroke-linecap="round"/>

  <text x="150" y="84" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Sparrow</text>
  <text x="150" y="314" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="18">Renderer output example built from rect, ring, line, path, and text primitives.</text>
  <text x="150" y="346" fill="#64748B" font-family="Consolas, monospace" font-size="16">import { createRenderer } from '@ksj_sparrow/sparrow'</text>
</svg>
