<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Renderer Transform 测试</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        padding: 2rem;
      }
      .container {
        max-width: 1000px;
        margin: 0 auto;
      }
      h2 {
        color: #42b883;
        border-bottom: 1px solid #eee;
        padding-bottom: 0.5rem;
      }
      .demo {
        margin: 2rem 0;
        padding: 1rem;
        border: 1px solid #eee;
        border-radius: 8px;
      }
      .transform-demo {
        display: flex;
        flex-wrap: wrap;
        gap: 2rem;
        justify-content: center;
      }
      .transform-case {
        text-align: center;
      }
      svg {
        border: 1px solid #ddd;
        border-radius: 4px;
        background-color: #f9f9f9;
      }
    </style>
    <script type="module" crossorigin src="/assets/modulepreload-polyfill-wMinxHhO.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>Renderer.js 变换功能测试</h1>

      <div class="demo">
        <h2>1. translate 平移变换</h2>
        <div class="transform-demo" id="translate-container">
          <div class="transform-case">
            <p>原始位置</p>
            <svg width="200" height="200"></svg>
          </div>
          <div class="transform-case">
            <p>平移后 (50, 50)</p>
            <svg width="200" height="200"></svg>
          </div>
        </div>
      </div>

      <div class="demo">
        <h2>2. rotate 旋转变换</h2>
        <div class="transform-demo" id="rotate-container">
          <div class="transform-case">
            <p>原始角度</p>
            <svg width="200" height="200"></svg>
          </div>
          <div class="transform-case">
            <p>旋转45°</p>
            <svg width="200" height="200"></svg>
          </div>
          <div class="transform-case">
            <p>旋转90°</p>
            <svg width="200" height="200"></svg>
          </div>
        </div>
      </div>

      <div class="demo">
        <h2>3. scale 缩放变换</h2>
        <div class="transform-demo" id="scale-container">
          <div class="transform-case">
            <p>原始大小</p>
            <svg width="200" height="200"></svg>
          </div>
          <div class="transform-case">
            <p>放大2倍</p>
            <svg width="200" height="200"></svg>
          </div>
          <div class="transform-case">
            <p>缩小0.5倍</p>
            <svg width="200" height="200"></svg>
          </div>
        </div>
      </div>

      <div class="demo">
        <h2>4. save/restore 状态保存与恢复</h2>
        <div class="transform-demo" id="save-restore-container">
          <div class="transform-case">
            <p>变换前</p>
            <svg width="200" height="200"></svg>
          </div>
          <div class="transform-case">
            <p>变换中</p>
            <svg width="200" height="200"></svg>
          </div>
          <div class="transform-case">
            <p>恢复后</p>
            <svg width="200" height="200"></svg>
          </div>
        </div>
      </div>
    </div>

  </body>
</html>
